schema_version = "1.0.0"

id = "blender_scene_assistant"
version = "0.6.3"
name = "场景领航员"
tagline = "点击助手，用中文安全地调整场景"
maintainer = "Blender Scene Assistant contributors"
type = "add-on"
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "经用户逐次确认后，将指令和最小物体摘要发送到用户自行配置的 AI 服务"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "/*.zip",
  "/dist/",
  "/tests/",
  "/docs/",
  "/benchmarks/",
  "/demos/",
  "/scripts/",
  "/*.docx",
  "/Blender*.md",
  "/AGENTS.md",
  "/DESIGN.md",
  "/PRODUCT.md",
  "/pyproject.toml",
]
