[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-scene-assistant"
version = "0.6.3"
description = "面向 Blender 的确定性场景编排与验证助手"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Blender Scene Assistant contributors" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["bsa*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
